<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소수의 나눗셈 실전모드</title>
<style>
  :root{
    --text:#4a4458; --ok:#7bd8a6; --no:#ff9aa2;
    --bg1:#fff1f6; --bg2:#ffe9f1; --bg3:#fff6ea;
    --blob1:#ffc2da; --blob2:#ffdcc2; --blob3:#e9d6ff;
    --accent:#f4c542;
    --padH:clamp(170px, 28vh, 280px);   /* 풀이 공간 높이 */
  }
  body[data-theme="sakura"]{--bg1:#fff1f6;--bg2:#ffe9f1;--bg3:#fff6ea;--blob1:#ffc2da;--blob2:#ffdcc2;--blob3:#e9d6ff}
  body[data-theme="ocean"] {--bg1:#e9f6ff;--bg2:#e3fbf7;--bg3:#eef1ff;--blob1:#b9e0ff;--blob2:#b5f0e4;--blob3:#cbd5ff}
  body[data-theme="lemon"] {--bg1:#fffbe0;--bg2:#f3ffe3;--bg3:#fff1e6;--blob1:#fff0a3;--blob2:#d6f5a8;--blob3:#ffd8b8}
  body[data-theme="grape"] {--bg1:#f4ecff;--bg2:#ffeef8;--bg3:#eaf0ff;--blob1:#dac6ff;--blob2:#ffc9e6;--blob3:#c6d6ff}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;
       background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
       font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       color:var(--text);display:flex;justify-content:center;padding:16px;position:relative}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 8% 12%,var(--blob1) 0,transparent 26%),
      radial-gradient(circle at 92% 22%,var(--blob2) 0,transparent 28%),
      radial-gradient(circle at 15% 88%,var(--blob3) 0,transparent 30%),
      radial-gradient(circle at 88% 85%,var(--blob1) 0,transparent 24%)}
  #app{width:100%;max-width:520px;position:relative;z-index:1}
  #app.wide{max-width:680px}
  section{background:rgba(255,255,255,.93);border-radius:36px;padding:24px 20px;
          box-shadow:0 10px 28px rgba(150,130,180,.22)}
  h1{font-size:2rem;margin:4px 0 6px;text-align:center}
  .rainbow{background:linear-gradient(90deg,#ff7eb3,#ffa86b,#f4c542,#5fd3a0,#5aaef5,#a78bfa);
           -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .sub{text-align:center;font-size:1.15rem;margin:0 0 16px}

  /* 캔디 버튼 */
  button{font-family:inherit;border:none;cursor:pointer;color:var(--text);font-weight:800}
  .candy{
    --c:#ffb3d1; --d:#ee86b0;
    position:relative; top:0; border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),var(--c);
    box-shadow:0 6px 0 var(--d),0 12px 16px rgba(80,60,120,.15);
    transition:top .07s, box-shadow .07s;
  }
  .candy:active{top:5px;box-shadow:0 1px 0 var(--d),0 3px 6px rgba(80,60,120,.15)}
  .c-pink  {--c:#ffb3d1;--d:#ee86b0}
  .c-peach {--c:#ffcaa6;--d:#f0a070}
  .c-yellow{--c:#ffe27a;--d:#e8bd3a}
  .c-lime  {--c:#c8f08f;--d:#9ccf56}
  .c-mint  {--c:#a6efdc;--d:#6fcdb4}
  .c-sky   {--c:#a9d8ff;--d:#6fb2ee}
  .c-purple{--c:#cdbaff;--d:#a088ee}
  .c-grad  {--c:#ffc2dc;--d:#d49ae8;
            background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),
                       linear-gradient(90deg,#ffb3d1,#ffd1a6,#c9f2b0,#b3dcff,#d4c2ff)}
  .big{width:100%;padding:18px;font-size:1.7rem}
  .row{display:flex;gap:14px;padding-bottom:6px}
  .row button{flex:1;padding:14px 8px;font-size:1.15rem}

  /* 입력 */
  .input{width:100%;font-size:1.6rem;padding:14px 18px;border-radius:999px;border:5px solid #cdbaff;
         text-align:center;font-family:inherit;font-weight:800;color:var(--text);outline:none;background:#fff;margin:6px 0 20px}
  .input:focus{border-color:#a088ee}
  .note{text-align:center;font-size:.95rem;opacity:.8;margin-top:14px;min-height:1.3em}

  /* 테마 */
  .themes{display:flex;justify-content:center;gap:14px;margin:0 0 18px;align-items:center;font-weight:700;font-size:1.05rem}
  .themes button{width:48px;height:48px;font-size:1.4rem;padding:0}
  .themes button.on{outline:4px solid #6f5fc9;outline-offset:2px}

  /* 단계 선택 */
  .levels{display:grid;gap:12px;margin-bottom:22px}
  .levels label{display:block;cursor:pointer}
  .levels input{display:none}
  .levels span{display:block;padding:14px 20px;border-radius:30px;font-size:1.2rem;font-weight:800;
               border:4px solid transparent;transition:transform .1s;
               box-shadow:0 5px 0 var(--d),0 10px 14px rgba(80,60,120,.12);
               background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),var(--c)}
  .levels label:nth-child(1) span{--c:#a6efdc;--d:#6fcdb4}
  .levels label:nth-child(2) span{--c:#ffe27a;--d:#e8bd3a}
  .levels label:nth-child(3) span{--c:#ffb3d1;--d:#ee86b0}
  .levels label:nth-child(4) span{--c:#cdbaff;--d:#a088ee}
  .levels input:checked + span{border-color:#5b4bc2;transform:scale(1.03)}
  .levels small{display:block;font-weight:500;font-size:.95rem;opacity:.85;margin-top:2px}
  .best{text-align:center;font-size:1.1rem;margin:16px 0 14px;min-height:1.5em}
  .hello{text-align:center;font-size:1.3rem;font-weight:800;margin:0 0 14px}

  /* 실전 */
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .pill{border-radius:999px;padding:8px 18px;font-size:1.25rem;font-weight:800;background:#a9d8ff;box-shadow:0 4px 0 #6fb2ee}
  .pill.timer{background:#a6efdc;box-shadow:0 4px 0 #6fcdb4;font-size:1.7rem;min-width:110px;text-align:center}
  .pill.timer.warn{background:#ff9aa2;box-shadow:0 4px 0 #e5707a;animation:pulse .6s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  .bar{height:16px;background:#eee8f7;border-radius:999px;overflow:hidden;margin-bottom:14px}
  .bar div{height:100%;width:100%;background:var(--ok);border-radius:999px;transition:width .1s linear}
  .question{font-size:2.7rem;font-weight:800;text-align:center;margin:10px 0;
            background:#fff0b3;border:5px solid var(--accent);
            border-radius:32px;padding:18px 8px;letter-spacing:1px;transition:background .2s,border-color .2s}

  /* 풀이 공간 */
  .padwrap{display:flex;gap:12px;align-items:stretch;margin:12px 0 14px;padding-bottom:6px}
  .canvaswrap{position:relative;flex:1;min-width:0;height:var(--padH);
              border:5px solid var(--accent);border-radius:28px;overflow:hidden;background-color:#fffefa;
              background-image:
                linear-gradient(rgba(150,130,180,.14) 1px, transparent 1px),
                linear-gradient(90deg, rgba(150,130,180,.14) 1px, transparent 1px);
              background-size:26px 26px;transition:border-color .2s}
  #scratch{position:absolute;inset:0;width:100%;height:100%;display:block;
           touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
  #scratch.erasing{cursor:cell}
  .padhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
           pointer-events:none;font-size:1.15rem;font-weight:700;color:#b3a9c6;padding:10px}
  .padhint.off{display:none}
  .tools{display:flex;flex-direction:column;gap:12px;width:74px;justify-content:center}
  .tools button{padding:10px 0 8px;font-size:1.6rem;line-height:1.1}
  .tools button small{display:block;font-size:.8rem;font-weight:800;margin-top:2px}
  .tools button.on{outline:4px solid #5b4bc2;outline-offset:2px}

  .answer{font-size:2.5rem;font-weight:800;text-align:center;min-height:78px;line-height:68px;
          border:5px dashed var(--accent);border-radius:32px;margin:10px 0;background:#fff}
  .answer.ok{border-color:var(--ok);background:#effcf5}
  .answer.no{border-color:var(--no);background:#fff0f1;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .toast{text-align:center;font-size:1.2rem;font-weight:800;height:1.6em;margin-bottom:8px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:6px;max-width:520px;margin:0 auto}
  .pad button{padding:14px 0;font-size:2rem}
  .pad .enter{grid-column:1 / -1;font-size:1.7rem;padding:16px 0}
  .pad .skip{grid-column:1 / -1;font-size:1.15rem;padding:10px 0}

  /* 결과 */
  .score-big{font-size:3.6rem;font-weight:900;text-align:center;margin:6px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .stats div{border-radius:26px;padding:12px 4px;text-align:center;font-size:1rem;font-weight:700}
  .stats div:nth-child(1){background:#a9d8ff;box-shadow:0 5px 0 #6fb2ee}
  .stats div:nth-child(2){background:#c8f08f;box-shadow:0 5px 0 #9ccf56}
  .stats div:nth-child(3){background:#ffcaa6;box-shadow:0 5px 0 #f0a070}
  .stats b{display:block;font-size:1.8rem}
  .msg{text-align:center;font-size:1.25rem;font-weight:800;margin:14px 0 12px}
  .st{text-align:center;font-weight:700;min-height:1.4em;margin:4px 0}
  .wrong{max-height:200px;overflow:auto;margin:10px 0 18px;padding:0 2px 6px;list-style:none}
  .wrong li{border-radius:22px;padding:10px 16px;margin-bottom:8px;font-size:1.15rem;font-weight:700}
  .wrong li:nth-child(3n+1){background:#ffe3ea}
  .wrong li:nth-child(3n+2){background:#fff1c9}
  .wrong li:nth-child(3n+3){background:#e0f1ff}
  .wrong .mine{color:#c45a64;font-weight:600}

  /* 리더보드 */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 16px}
  .tabs button{padding:10px 0;font-size:1rem}
  .tabs button.on{outline:4px solid #5b4bc2;outline-offset:2px}
  .lb{list-style:none;margin:8px 0 14px;padding:0 2px 6px}
  .lb li{display:flex;justify-content:space-between;gap:8px;border-radius:22px;padding:10px 16px;
         margin-bottom:8px;font-size:1.15rem;font-weight:800}
  .lb li:nth-child(5n+1){background:#ffe3ea}
  .lb li:nth-child(5n+2){background:#fff1c9}
  .lb li:nth-child(5n+3){background:#dff7ec}
  .lb li:nth-child(5n+4){background:#e0f1ff}
  .lb li:nth-child(5n+5){background:#ece3ff}
  .lb li.me{outline:4px solid #6f5fc9}
  .lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  [hidden]{display:none !important}
</style>
</head>
<body data-theme="sakura">
<div id="app">

  <!-- 입장(닉네임) 화면 -->
  <section id="login">
    <h1 class="rainbow">🧮 소수의 나눗셈</h1>
    <p class="sub">닉네임을 정하고 입장해요!<br>(실명 대신 별명을 써 주세요)</p>
    <input class="input" id="nick" type="text" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
    <button class="candy c-grad big" id="enterBtn">입장하기 🚪</button>
    <div class="note" id="loginNote"></div>
  </section>

  <!-- 홈 -->
  <section id="home" hidden>
    <h1 class="rainbow">🧮 소수의 나눗셈</h1>
    <p class="hello" id="hello"></p>
    <div class="themes" id="themes">
      <span>배경</span>
      <button class="candy c-pink"   data-t="sakura" aria-label="벚꽃 테마">🌸</button>
      <button class="candy c-sky"    data-t="ocean"  aria-label="바다 테마">🌊</button>
      <button class="candy c-yellow" data-t="lemon"  aria-label="레몬 테마">🍋</button>
      <button class="candy c-purple" data-t="grape"  aria-label="포도 테마">🍇</button>
    </div>
    <div class="levels">
      <label><input type="radio" name="level" value="1" checked><span>1단계 🍀<small>소수 ÷ 자연수 &nbsp;예) 7.2 ÷ 4</small></span></label>
      <label><input type="radio" name="level" value="2"><span>2단계 🌼<small>소수 ÷ 소수 &nbsp;예) 4.8 ÷ 0.6</small></span></label>
      <label><input type="radio" name="level" value="3"><span>3단계 🌈<small>소수 두 자리 ÷ 소수 한 자리 &nbsp;예) 1.44 ÷ 0.8</small></span></label>
      <label><input type="radio" name="level" value="4"><span>섞어서 풀기 🎲<small>1~3단계 랜덤</small></span></label>
    </div>
    <div class="best" id="best"></div>
    <button class="candy c-grad big" id="startBtn">시작하기!</button>
    <div class="row" style="margin-top:20px">
      <button class="candy c-yellow" id="boardBtn">🏆 리더보드</button>
      <button class="candy c-sky" id="renameBtn">✏️ 닉네임 바꾸기</button>
    </div>
  </section>

  <!-- 실전 -->
  <section id="play" hidden>
    <div class="top">
      <div class="pill">⭕ <span id="sc">0</span>개</div>
      <div class="pill timer" id="timer">3:00</div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="question" id="question"></div>

    <!-- 풀이 공간 + 옆 도구 버튼 -->
    <div class="padwrap">
      <div class="canvaswrap">
        <canvas id="scratch"></canvas>
        <div class="padhint" id="padHint">✏️ 여기에 풀이를 써 보세요</div>
      </div>
      <div class="tools" id="tools">
        <button class="candy c-lime on" data-tool="pen" aria-label="펜">✏️<small>펜</small></button>
        <button class="candy c-pink" data-tool="eraser" aria-label="지우개">🧽<small>지우개</small></button>
        <button class="candy c-sky" data-tool="clear" aria-label="전체 지우기">🗑️<small>전체</small></button>
      </div>
    </div>

    <div class="answer" id="answer"></div>
    <div class="toast" id="toast"></div>
    <div class="pad" id="pad">
      <button class="candy c-pink"   data-k="7">7</button>
      <button class="candy c-peach"  data-k="8">8</button>
      <button class="candy c-yellow" data-k="9">9</button>
      <button class="candy c-lime"   data-k="4">4</button>
      <button class="candy c-mint"   data-k="5">5</button>
      <button class="candy c-sky"    data-k="6">6</button>
      <button class="candy c-purple" data-k="1">1</button>
      <button class="candy c-pink"   data-k="2">2</button>
      <button class="candy c-peach"  data-k="3">3</button>
      <button class="candy c-yellow" data-k=".">.</button>
      <button class="candy c-lime"   data-k="0">0</button>
      <button class="candy c-purple" data-k="back">⌫</button>
      <button class="candy c-grad enter" data-k="enter">확인</button>
      <button class="candy c-sky skip" data-k="skip">패스 ⏭</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" hidden>
    <h1 class="rainbow">⏰ 시간 끝!</h1>
    <div class="score-big rainbow" id="rScore"></div>
    <div class="msg" id="rMsg"></div>
    <div class="stats">
      <div>푼 문제<b id="rTotal"></b></div>
      <div>정답률<b id="rRate"></b></div>
      <div>내 최고<b id="rBest"></b></div>
    </div>
    <div class="msg" id="rLbTitle">🏆 리더보드</div>
    <div class="st" id="rStatus"></div>
    <ol class="lb" id="rList"></ol>
    <div id="wrongWrap" hidden>
      <div class="msg">다시 확인해 볼 문제 📝</div>
      <ul class="wrong" id="wrongList"></ul>
    </div>
    <div class="row">
      <button class="candy c-pink" id="retryBtn">다시 도전!</button>
      <button class="candy c-sky" id="homeBtn">처음으로</button>
    </div>
  </section>

  <!-- 리더보드 -->
  <section id="board" hidden>
    <h1 class="rainbow">🏆 리더보드</h1>
    <div class="tabs" id="tabs">
      <button class="candy c-mint"   data-lv="1">1단계</button>
      <button class="candy c-yellow" data-lv="2">2단계</button>
      <button class="candy c-pink"   data-lv="3">3단계</button>
      <button class="candy c-purple" data-lv="4">섞어서</button>
    </div>
    <div class="st" id="bStatus"></div>
    <ol class="lb" id="bList"></ol>
    <div class="row">
      <button class="candy c-sky" id="backBtn">← 홈으로</button>
    </div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, getDocs, query, where, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBzvBU7N37JmN-EdAx_PODt0mbnHN7r7t0",
  authDomain: "th-853e6.firebaseapp.com",
  projectId: "th-853e6",
  storageBucket: "th-853e6.firebasestorage.app",
  messagingSenderId: "1011976369560",
  appId: "1:1011976369560:web:2cf41aaf787743d6c267ed"
};
let db = null, auth = null, uid = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
} catch (e) { console.error("Firebase 초기화 실패", e); }

async function ensureUid(){
  if (uid) return uid;
  if (!auth) throw new Error("no-auth");
  const cred = await signInAnonymously(auth);
  uid = cred.user.uid;
  return uid;
}

function errText(err){
  console.error(err);
  const c = (err && err.code) || "";
  if (c === "auth/operation-not-allowed" || c === "auth/admin-restricted-operation")
    return "콘솔에서 '익명 로그인'을 사용 설정해 주세요.";
  if (c === "auth/unauthorized-domain") return "이 주소가 Firebase 승인된 도메인에 없어요.";
  if (c === "permission-denied") return "권한 오류예요. 규칙 게시와 익명 로그인 설정을 확인해 주세요.";
  if (c === "failed-precondition") return "색인이 필요해요. F12 콘솔의 링크로 색인을 만들어 주세요.";
  if (c === "unavailable") return "인터넷 연결을 확인해 주세요.";
  return "리더보드 연결에 문제가 있어요. (" + (c || "오류") + ")";
}

/* ===== 공통 ===== */
const DURATION = 180;   // 제한 시간(초) - 3분 / 문제 수는 제한 없음
const $ = id => document.getElementById(id);
const screens = {login:$("login"), home:$("home"), play:$("play"), result:$("result"), board:$("board")};
const LEVEL_NAME = {1:"1단계", 2:"2단계", 3:"3단계", 4:"섞어서"};
const QCOLORS = [
  ["#fff0b3","#f4c542"], ["#ffd6e7","#ff8fb8"], ["#d4f5e9","#5fd3a0"],
  ["#d6ebff","#5aaef5"], ["#e6dcff","#a78bfa"], ["#ffe0cc","#ff9f6b"]
];
function show(name){
  for (const k in screens) screens[k].hidden = (k !== name);
  $("app").classList.toggle("wide", name === "play");
  window.scrollTo(0,0);
}

let nick = "", level = 1, endAt = 0, timerId = null, cur = null, input = "";
let correct = 0, total = 0, wrong = [], running = false, colorIdx = 0, boardLevel = 1;
let tries = 0, firstWrong = "";
const RETRY_COUNTS = true;   // true: 두 번째 시도 정답도 점수 인정 / false: 첫 시도 정답만 인정

/* ===== 로컬 저장 ===== */
const K_BEST = "decimalDivBest_v2", K_THEME = "decimalDivTheme_v1", K_NICK = "decimalDivNick_v1";
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function loadBest(){ try { return JSON.parse(lsGet(K_BEST)) || {}; } catch(e){ return {}; } }
function saveBest(lv,v){ const b = loadBest(); b[lv] = v; lsSet(K_BEST, JSON.stringify(b)); }

/* ===== 테마 ===== */
function setTheme(t, save){
  document.body.setAttribute("data-theme", t);
  document.querySelectorAll("#themes button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (save) lsSet(K_THEME, t);
}

/* ===== 풀이 공간 (스마트펜 / 손가락 / 마우스) ===== */
const cv = $("scratch");
const ctx = cv.getContext("2d");
let tool = "pen", drawing = false, activePid = null, lastPt = null, penSeen = false, strokeTool = "pen";

function fitCanvas(){
  const r = cv.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (cv.width === w && cv.height === h) return;
  const tmp = document.createElement("canvas");
  tmp.width = cv.width; tmp.height = cv.height;
  if (cv.width && cv.height) tmp.getContext("2d").drawImage(cv, 0, 0);
  cv.width = w; cv.height = h;
  ctx.drawImage(tmp, 0, 0);
}
function clearPad(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  $("padHint").classList.remove("off");
}
function setTool(t){
  tool = t;
  document.querySelectorAll("#tools button[data-tool]").forEach(b => {
    if (b.dataset.tool !== "clear") b.classList.toggle("on", b.dataset.tool === t);
  });
  cv.classList.toggle("erasing", t === "eraser");
}
function ptOf(e){
  const r = cv.getBoundingClientRect();
  const k = cv.width / r.width;
  return { x:(e.clientX - r.left) * k, y:(e.clientY - r.top) * k, k:k, p:e.pressure };
}
function drawSeg(a, b, pointerType){
  const k = b.k;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (strokeTool === "eraser"){
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineWidth = 24 * k;
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "#3b3550";
    let w = 3.2;
    if (pointerType === "pen" && b.p > 0) w = 1.6 + b.p * 4;   // 필압 반영
    ctx.lineWidth = w * k;
  }
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.globalCompositeOperation = "source-over";
}
cv.addEventListener("pointerdown", e => {
  if (!running) return;
  if (e.pointerType === "pen") penSeen = true;
  if (e.pointerType === "touch" && penSeen) return;          // 손바닥 방지
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  drawing = true; activePid = e.pointerId;
  strokeTool = (e.buttons & 32) ? "eraser" : tool;          // 펜 뒤쪽 지우개 버튼
  $("padHint").classList.add("off");
  const p = ptOf(e);
  lastPt = p;
  drawSeg(p, { x:p.x + 0.01, y:p.y + 0.01, k:p.k, p:p.p }, e.pointerType);   // 점 찍기
});
cv.addEventListener("pointermove", e => {
  if (!drawing || e.pointerId !== activePid) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const ev of evs){
    const p = ptOf(ev);
    drawSeg(lastPt, p, e.pointerType);
    lastPt = p;
  }
});
function endStroke(e){
  if (e.pointerId !== activePid) return;
  drawing = false; activePid = null; lastPt = null;
}
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("lostpointercapture", endStroke);
cv.addEventListener("contextmenu", e => e.preventDefault());

$("tools").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tool === "clear") clearPad();
  else setTool(b.dataset.tool);
});
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv);
window.addEventListener("resize", fitCanvas);

/* ===== 문제 생성 (정수 연산) ===== */
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
function fmt(n, d){
  let s = (n / Math.pow(10,d)).toFixed(d);
  if (d > 0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s;
}
function nonTen(a,b){ let x; do { x = rnd(a,b); } while (x % 10 === 0); return x; }
function make(lv){
  if (lv === 4) lv = rnd(1,3);
  let b, bd, q, qd;
  if (lv === 1){ b = rnd(2,9);  bd = 0; q = nonTen(11,99); qd = 1; }
  else if (lv === 2){ b = nonTen(2,49); bd = 1; q = rnd(2,19); qd = 0; }
  else { b = nonTen(2,49); bd = 1; q = nonTen(11,99); qd = 1; }
  const a = b * q, ad = bd + qd;
  return { text: fmt(a,ad) + " ÷ " + fmt(b,bd), answerNum: q / Math.pow(10,qd), answerText: fmt(q,qd) };
}

/* ===== 입장 / 홈 ===== */
function enter(){
  const v = $("nick").value.trim();
  if (!v){ $("loginNote").textContent = "닉네임을 입력해 주세요."; return; }
  nick = v.slice(0,10);
  lsSet(K_NICK, nick);
  $("loginNote").textContent = "";
  goHome();
  ensureUid().catch(err => console.warn("익명 로그인 실패:", err));
}
function goHome(){
  $("hello").textContent = "안녕, " + nick + "! 👋";
  renderBest();
  show("home");
}
function renderBest(){
  const b = loadBest();
  const lv = document.querySelector('input[name="level"]:checked').value;
  $("best").textContent = b[lv] != null ? "🏆 내 최고 기록: " + b[lv] + "개" : "첫 기록에 도전해 보세요!";
}

/* ===== 게임 ===== */
function start(){
  level = +document.querySelector('input[name="level"]:checked').value;
  correct = 0; total = 0; wrong = []; input = ""; running = true; colorIdx = rnd(0, QCOLORS.length-1);
  $("sc").textContent = "0"; $("toast").textContent = "";
  show("play");
  fitCanvas();
  setTool("pen");
  nextQ();
  endAt = Date.now() + DURATION*1000;
  tick();
  clearInterval(timerId);
  timerId = setInterval(tick, 100);
}
function nextQ(){
  cur = make(level); input = ""; tries = 0; firstWrong = "";
  colorIdx = (colorIdx + 1) % QCOLORS.length;
  const c = QCOLORS[colorIdx];
  $("question").style.background = c[0];
  $("play").style.setProperty("--accent", c[1]);
  $("question").textContent = cur.text + " = ?";
  clearPad();                       // 새 문제가 나오면 풀이 공간 비우기
  renderAnswer();
}
function renderAnswer(){
  const el = $("answer");
  el.textContent = input === "" ? "정답을 입력하세요" : input;
  el.style.fontSize = input === "" ? "1.2rem" : "";
  el.style.color = input === "" ? "#b3a9c6" : "";
}
function tick(){
  const remain = Math.max(0, endAt - Date.now());
  const sec = Math.ceil(remain/1000);
  $("timer").textContent = Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
  $("timer").classList.toggle("warn", sec <= 10);
  $("barFill").style.width = (remain/(DURATION*1000)*100) + "%";
  $("barFill").style.background = sec <= 10 ? "var(--no)" : "var(--ok)";
  if (remain <= 0) finish();
}
function press(k){
  if (!running) return;
  if (k === "back"){ input = input.slice(0,-1); }
  else if (k === "enter"){ submit(); return; }
  else if (k === "skip"){ skip(); return; }
  else if (k === "."){ if (input.indexOf(".") === -1) input = (input === "" ? "0" : input) + "."; }
  else if (/^\d$/.test(k)){ if (input.length < 6) input += k; }
  renderAnswer();
}
function flash(ok, msg){
  const el = $("answer");
  el.className = "answer " + (ok ? "ok" : "no");
  $("toast").textContent = msg;
  $("toast").style.color = ok ? "#2e9e68" : "#c45a64";
  setTimeout(()=>{ el.className = "answer"; }, 300);
}
function submit(){
  if (input === "" || input === "." || input === "0.") return;
  const ok = Math.abs(parseFloat(input) - cur.answerNum) < 1e-9;
  const mine = input;

  if (ok){
    total++;
    if (tries === 0 || RETRY_COUNTS){
      correct++; $("sc").textContent = correct;
    } else {
      wrong.push({q:cur.text, mine:firstWrong + " → " + mine, ans:cur.answerText});
    }
    flash(true, tries === 0 ? "정답! 👍" : "두 번째에 맞혔어요! 👏");
    nextQ();
    return;
  }

  // 오답
  if (tries === 0){
    tries = 1; firstWrong = mine; input = "";
    renderAnswer();
    flash(false, "아쉬워요! 한 번 더 도전해 봐요 💪");
    return;
  }
  total++;
  wrong.push({q:cur.text, mine:firstWrong + " → " + mine, ans:cur.answerText});
  flash(false, "아쉬워요! 정답은 " + cur.answerText + " 😢");
  nextQ();
}
function skip(){
  total++;
  wrong.push({q:cur.text, mine:"패스", ans:cur.answerText});
  flash(false, "패스! 다음 문제 ➡️");
  nextQ();
}

function finish(){
  if (!running) return;
  running = false;
  drawing = false;
  clearInterval(timerId);
  const b = loadBest();
  const prev = b[level];
  const isNew = (prev == null || correct > prev);
  if (isNew) saveBest(level, correct);
  const bestNow = isNew ? correct : prev;

  $("rScore").textContent = "⭕ " + correct + "개";
  $("rTotal").textContent = total + "개";
  $("rRate").textContent = total ? Math.round(correct/total*100) + "%" : "-";
  $("rBest").textContent = bestNow + "개";
  let m;
  if (correct === 0) m = "괜찮아요! 천천히 다시 해 봐요 🌱";
  else if (isNew) m = "새 기록이에요! 대단해요 🎉";
  else if (total && correct/total >= 0.9) m = "정확도 최고! 멋져요 ⭐";
  else m = "잘했어요! 한 번 더 도전해 볼까요? 💪";
  $("rMsg").textContent = m;
  $("rLbTitle").textContent = "🏆 " + LEVEL_NAME[level] + " 리더보드";

  const list = $("wrongList");
  list.innerHTML = "";
  wrong.forEach(w => {
    const li = document.createElement("li");
    li.appendChild(document.createTextNode(w.q + " = " + w.ans + "  "));
    const s = document.createElement("span");
    s.className = "mine"; s.textContent = "(내 답: " + w.mine + ")";
    li.appendChild(s);
    list.appendChild(li);
  });
  $("wrongWrap").hidden = wrong.length === 0;
  $("rList").innerHTML = "";
  $("rStatus").textContent = "";
  show("result");
  submitScore();
}

/* ===== 리더보드 ===== */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

async function fetchTop(lv){
  const q = query(collection(db,"leaderboard"),
    where("level","==",lv), orderBy("score","desc"), orderBy("createdAt","asc"), limit(50));
  const snap = await getDocs(q);
  const rows = snap.docs.map(d => ({id:d.id, ...d.data()}));
  rows.forEach((r,i) => { r.rank = (i>0 && rows[i-1].score === r.score) ? rows[i-1].rank : i+1; });
  return rows;
}

function renderRows(ol, rows, myId){
  ol.innerHTML = "";
  const medal = {1:"🥇",2:"🥈",3:"🥉"};
  const addRow = r => {
    const li = el("li", r.id === myId ? "me" : "");
    li.appendChild(el("span","nm",(medal[r.rank] || r.rank + "위") + "  " + r.name));
    li.appendChild(el("span","",r.score + "개"));
    ol.appendChild(li);
  };
  rows.slice(0,10).forEach(addRow);
  const mine = rows.find(r => r.id === myId);
  if (mine && rows.indexOf(mine) >= 10) addRow(mine);
  return mine ? mine.rank : null;
}

async function submitScore(){
  const st = $("rStatus");
  if (!db){ st.textContent = "리더보드에 연결되지 않았어요."; return; }
  try {
    const id = await ensureUid();
    const docId = id + "_" + level;
    if (correct > 0){
      st.textContent = "기록 등록 중...";
      const ref = doc(db,"leaderboard",docId);
      const snap = await getDoc(ref);
      if (!snap.exists() || correct > snap.data().score){
        await setDoc(ref, {name:nick, score:correct, total:total, level:level, createdAt:serverTimestamp()});
        st.textContent = "리더보드에 등록했어요! 🎉";
      } else {
        st.textContent = "이전 최고 기록(" + snap.data().score + "개)을 넘으면 등수가 올라가요!";
      }
    } else {
      st.textContent = "1개 이상 맞히면 리더보드에 등록돼요!";
    }
    const rows = await fetchTop(level);
    const rank = renderRows($("rList"), rows, docId);
    if (!rows.length) st.textContent = "아직 기록이 없어요.";
    else if (rank) st.textContent += "  내 등수: " + rank + "위";
    else if (rows.length >= 50) st.textContent += "  (50위 밖이에요)";
  } catch(err){
    st.textContent = errText(err);
  }
}

async function loadBoard(lv){
  boardLevel = lv;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", +b.dataset.lv === lv));
  const st = $("bStatus");
  $("bList").innerHTML = "";
  if (!db){ st.textContent = "리더보드에 연결되지 않았어요."; return; }
  st.textContent = "불러오는 중...";
  try {
    const id = await ensureUid();
    const rows = await fetchTop(lv);
    if (boardLevel !== lv) return;
    const rank = renderRows($("bList"), rows, id + "_" + lv);
    st.textContent = !rows.length ? "아직 기록이 없어요. 첫 주인공이 되어 보세요!"
                   : rank ? "내 등수: " + rank + "위" : "";
  } catch(err){
    st.textContent = errText(err);
  }
}

/* ===== 이벤트 ===== */
$("enterBtn").addEventListener("click", enter);
$("nick").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("renameBtn").addEventListener("click", () => { $("nick").value = nick; show("login"); });
$("startBtn").addEventListener("click", start);
$("retryBtn").addEventListener("click", start);
$("homeBtn").addEventListener("click", goHome);
$("boardBtn").addEventListener("click", () => {
  const lv = +document.querySelector('input[name="level"]:checked').value;
  show("board"); loadBoard(lv);
});
$("backBtn").addEventListener("click", goHome);
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) loadBoard(+b.dataset.lv);
});
$("pad").addEventListener("click", e => {
  const k = e.target.closest("button");
  if (k) press(k.dataset.k);
});
$("themes").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) setTheme(b.dataset.t, true);
});
document.querySelectorAll('input[name="level"]').forEach(r => r.addEventListener("change", renderBest));
document.addEventListener("keydown", e => {
  if (screens.play.hidden) return;
  if (e.key === "Enter") { e.preventDefault(); press("enter"); }
  else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
  else if (e.key === "." || e.key === ",") press(".");
  else if (/^\d$/.test(e.key)) press(e.key);
});

/* ===== 시작 ===== */
const savedTheme = lsGet(K_THEME);
setTheme(["sakura","ocean","lemon","grape"].indexOf(savedTheme) >= 0 ? savedTheme : "sakura", false);
$("nick").value = lsGet(K_NICK) || "";
show("login");
</script>
